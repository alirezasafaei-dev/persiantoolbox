name: Android
on:
  workflow_dispatch:
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: ./gradlew --version
      - run: ./gradlew projects
      - run: ./gradlew test lint :apps:documents:assembleDebug :apps:documents:assembleRelease dependencyVerification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-engineering-apks
          path: android/apps/documents/build/outputs/apk/**/*.apk
